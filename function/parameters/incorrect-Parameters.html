    <h1>Incorrect Arguments in Functions</h1>

        function greet(age){
            return "hello " + age;
        }
        let message = greet();
        //  function greet(age){
        //     return "hello " + age*18;
        // }
        // let message = greet();
        document.getElementById("result").innerHTML = message;
    </script>
