<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Invocation with console</h1>
    <p>In this example, we will demonstrate how to invoke a function with a console.log statement.</p>
    <p id="result"></p>

    <script>
        function greet(name) {
            return "Hello, " + name + "! Welcome to the world of functions.";
        }

        let userName = greet("Shubham");
        console.log(userName);
    </script>
</body>
</html>
