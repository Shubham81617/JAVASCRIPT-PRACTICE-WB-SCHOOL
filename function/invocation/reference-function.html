<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Reference to a Function</h1>
    <p>This example demonstrates how to reference a function and call it later.</p>
    <p id="result"></p>
    <script>
        function greet(){
            return "hello, myself shubham";
        }
        let message = greet; 
        document.getElementById("result").innerHTML = message; 
    </script>
</body>
</html>
