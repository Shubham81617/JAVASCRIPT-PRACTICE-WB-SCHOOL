<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Calling a Function from Anywhere</h1>
    <p>This example demonstrates how to call a function from anywhere in the code.</p>
   <button onclick="displayMessage()" onblur="handleBlur9()">Click me</button>
   <p id="result"></p>
  
    <script>
       function sayHello(){
        return "Hello, welcome to the world of functions!";
       }
       function handleBlur9(){
        let message1= ""
        document.getElementById("result").innerHTML = message1;
       }
       function displayMessage(){
        let message = sayHello();
        document.getElementById("result").innerHTML = message;
       }
    </script>
</body>
</html>
