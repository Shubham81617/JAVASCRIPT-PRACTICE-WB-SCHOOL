<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Basic Function Syntax</h1>
    <p>Functions are blocks of code that can be defined once and executed multiple times. They can take parameters and return values.</p>
    <p id="result"></p>
    <script>
        function greet(){
            return "Hello, welcome to the world of functions!";
        }
        document.getElementById("result").innerHTML = greet();
    </script>
</body>
</html>
