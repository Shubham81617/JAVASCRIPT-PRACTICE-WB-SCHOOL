<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> Parameter and Arguments</h1>
    <p>Parameters are variables that are defined in the function declaration, while arguments are the actual values passed to the function when it is called.</p>
    <p id="result"></p>

    <script>
        function greet(name) {
            return "Hello, " + name + "! Welcome to the world of functions.";
        }
        document.getElementById("result").innerHTML = greet("Shubham");
    </script>
</body>
</html>
