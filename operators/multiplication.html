<body>
    <h1>Multiplication Operator</h1>
    <p>The (*) operator multiplies two values.</p>

    <p >Value of z is <span id="zValue"></span></p>
    <script>
        let x=10;
    let y=5;
    let z=x*y;
        document.getElementById("zValue").innerHTML = z;
    </script>
