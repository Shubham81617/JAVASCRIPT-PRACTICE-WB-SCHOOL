<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Decrement Operator</h1>
    <p>The (--) operator decrements the value of a variable by 1.</p>

    <p>Value of z is <span id="zValue"></span></p>
    <script>
        let x = 10;
        x--;
        let y = 5;
        y--;
        let z = x + y;
        document.getElementById("zValue").innerHTML = z;
    </script>
</body>

</html
