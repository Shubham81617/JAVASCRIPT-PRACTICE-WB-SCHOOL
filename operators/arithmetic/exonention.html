<body>
    <h1>Exponentiation Operator</h1>
    <p>The (**) operator raises a number to a power.</p>

    <p>Value of z is <span id="zValue"></span></p>
    <script>
        let x = 2;
        let y = 4;
        // let z = x ** y;
        let z=Math.pow(x,y);
        document.getElementById("zValue").innerHTML = z;
    </script>
</body>
