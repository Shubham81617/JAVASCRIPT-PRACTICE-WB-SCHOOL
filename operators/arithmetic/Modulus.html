<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Modulus Operator</h1>
    <p>The (%) operator returns the remainder of a division.</p>

    <p >Value of z is <span id="zValue"></span></p>
    <script>
        let x=12;
    let y=5;
    let z=x%y;
        document.getElementById("zValue").innerHTML = z;
    </script>
</body>
</html
