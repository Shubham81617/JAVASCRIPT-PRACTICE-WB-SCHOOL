<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Precedence of Operator</h1>
    <p>The precedence of operators determines the order by (BODMAS) in which operations are performed in an expression.</p>

    <p>Value of z is <span id="zValue"></span></p>
    <script>
        let x = 2;
        let a=3;
        let b=2;
        let y = 5;
       let p =4;
        let z = x**a -1 + (y * p)/b;
        document.getElementById("zValue").innerHTML = z;
    </script>
</body>

</html
