<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Function without Return Statement</h1>
    <p>This example demonstrates a function that does not have a return statement. In this case, the function will return undefined.</p>
    <p id="result"></p>

    <script>
        function mutliply(a,b){
            let result = a*b;
        }
        let message = mutliply(5, 3);
        document.getElementById("result").innerHTML = "The result is: " + message; // This will display "The result is: undefined" because the function does not return a value.
    </script>
</body>
</html>
