<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Return Statement with Expression</h1>
    <p>This example demonstrates how to use the return statement with an expression in a function.</p>
    <p id="result"></p>
    <script>
        function multiply(a,b){
            return a*b;
        }
        let result = multiply(5, 3)*10;
        document.getElementById("result").innerHTML = "The product is: " + result;
    </script>
</body>
</html>
