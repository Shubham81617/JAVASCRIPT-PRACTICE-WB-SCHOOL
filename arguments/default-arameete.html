<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Default Parameters</h1>
    <p>This example demonstrates how to use default parameters in functions.</p>
    <p id="result"></p>
    <script>
        function multiply(a, b = 2) {
            return a * b;
        }
        let message = multiply(4);
        document.getElementById("result").innerHTML = message+" is the answer";
    </script>
</body>

</html>
